# 10 cấu hình MLP đối chứng khóa trước theo số tham số (xem experiment_spec.md Mục 4)
# Bao gồm thang SiLU (depth 2–4, 25–2241 tham số) và 2 điểm đối chứng Tanh tại mức 45 & 177 tham số.
experiment_id: core_panel_mlp
task: exp_sin_y2
input_dim: 2
output_dim: 1
activation: silu
bias: true
init: xavier_uniform
dtype: float64
default_seed: 42
focal_config_id: mlp_d2_w11
focal_seeds: [42, 43, 44]
optimizer:
  name: LBFGS
  # Ghi checkpoint MLP ở cùng số lần gọi optimizer.step tích lũy với lịch KAN.
  outer_steps: 1000
  checkpoint_outer_steps: [200, 400, 600, 800, 1000]
  max_iter: 20
  line_search_fn: strong_wolfe

models:
  - config_id: mlp_d2_w6
    hidden_widths: [6]
    expected_params: 25
    kan_reference: "KAN [2,1,1] G=3"
  - config_id: mlp_d2_w11
    hidden_widths: [11]
    expected_params: 45
    kan_reference: "KAN [2,1,1] G=10 (focal comparison)"
  - config_id: mlp_tanh_d2_w11
    hidden_widths: [11]
    activation: tanh
    expected_params: 45
    kan_reference: "Tanh control at 45-param focal budget"
  - config_id: mlp_d2_w19
    hidden_widths: [19]
    expected_params: 77
    kan_reference: "KAN [2,1,1] G=20"
  - config_id: mlp_d2_w41
    hidden_widths: [41]
    expected_params: 165
    kan_reference: "KAN [2,1,1] G=50"
  - config_id: mlp_d3_w11
    hidden_widths: [11, 11]
    expected_params: 177
    kan_reference: "Depth-3 comparison near G=50"
  - config_id: mlp_tanh_d3_w11
    hidden_widths: [11, 11]
    activation: tanh
    expected_params: 177
    kan_reference: "Tanh control at 177-param depth-3 budget"
  - config_id: mlp_d3_w20
    hidden_widths: [20, 20]
    expected_params: 501
    kan_reference: "Medium-capacity depth-3 scaling point"
  - config_id: mlp_d4_w24
    hidden_widths: [24, 24, 24]
    expected_params: 1297
    kan_reference: "High-capacity depth-4 scaling point"
  - config_id: mlp_d4_w32
    hidden_widths: [32, 32, 32]
    expected_params: 2241
    kan_reference: "Upper depth-4 scaling point (>2k params)"
